
title: "Recursos Educativos Interactivos"
description: "Plataforma educativa de apuntes, temarios y ejercicios interactivos"
author: "Jesús Ortega"

# Configuración de GitHub Pages
url: "https://jesusortegamiguel-pixel.github.io"
baseurl: ""

# Configuración de Jekyll
markdown: kramdown
theme: null
permalink: pretty

# Idioma
lang: es

# Colecciones y contenido
collections:
  asignaturas:
    output: true
    permalink: /asignaturas/:name/

  unidades:
    output: true
    permalink: /unidades/:path/

# Exclusiones
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
