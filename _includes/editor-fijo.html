{% assign codigo = include.codigo | default: '// Escribe aquí tu ejemplo' %}
{% assign archivo = include.archivo | default: 'ejemplo.js' %}

<div class="fixed-code-editor" data-fixed-editor>

    <div class="fixed-code-header">

        <div class="fixed-code-dots">
            <span></span><span></span><span></span>
        </div>

        <span class="fixed-code-filename">
            {{ archivo | escape }}
        </span>

        <span class="fixed-code-lang">
            {{ archivo | split: "." | last | upcase }}
        </span>

        <button type="button" class="fixed-code-copy">
            <span class="copy-icon">▢</span>
            <span class="copy-label">Copiar código</span>
        </button>

    </div>

    <textarea class="fixed-code-source" hidden>{{ codigo | escape }}</textarea>

    <div class="fixed-code-content"></div>

    <div class="fixed-code-footer">
        <span>Editor de código</span>
        <span>Solo lectura</span>
    </div>

</div>
