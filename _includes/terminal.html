
<div class="terminal-block">
  <div class="terminal-header">
    <div class="terminal-dots">
      <span></span><span></span><span></span>
    </div>
    <span>{{ include.title | default: "Terminal" }}</span>

    <button class="terminal-copy" type="button"
      onclick="
        const code = this.closest('.terminal-block')
          .querySelectorAll('.terminal-command code');
        const text = Array.from(code)
          .map(el => el.textContent).join('\n');
        navigator.clipboard.writeText(text).then(() => {
          this.textContent = 'Copiado';
          setTimeout(() => this.textContent = 'Copiar', 2000);
        });
      ">
      Copiar comandos
    </button>
  </div>

  <div class="terminal-body">
    {% if include.code %}
    <div class="terminal-command">
      <span class="terminal-prompt">$</span>
      <pre><code>{{ include.code | strip | escape }}</code></pre>
    </div>
    {% endif %}

    {% if include.output %}
    <div class="terminal-output">
      <pre>{{ include.output | strip | escape }}</pre>
    </div>
    {% endif %}
  </div>
</div>
