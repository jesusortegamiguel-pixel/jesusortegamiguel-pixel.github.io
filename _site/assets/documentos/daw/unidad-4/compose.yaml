services:
  database:
    image: mysql:5.7
    container_name: crudmysql_database_contenidor
    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_ROOT_USER: root
      MYSQL_PASSWORD: crud123

    volumes:
      - ./database/init.sql:/data/application/init.sql

    command: --init-file /data/application/init.sql

    networks:
      - crud_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: start

    container_name: crudmysql_web_contenidor
    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - database

    command: >
      sh -c '/usr/src/app/wait-for-it.sh -t 0 database:3306 -- npm start'

    networks:
      - crud_net

networks:
  crud_net:
    driver: bridge
